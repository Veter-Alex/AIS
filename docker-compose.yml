services:
  # База данных PostgreSQL (персистентная)
  db:
    image: pgvector/pgvector:pg15  # PostgreSQL 15 с предустановленным расширением pgvector
    restart: always     # Автоматически перезапускать контейнер при падении/рестарте Docker
    env_file: .env      # Загружать ENV-переменные из файла .env (используется ниже)
    environment:
      # Название БД, пользователь и пароль — берутся из .env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Хост и порт для удобства проброса в другие сервисы
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "5432:5432"   # Публикуем порт Postgres на хосте для локальных подключений
    volumes:
      - ./data/postgres:/var/lib/postgresql/data  # Персистентные данные БД на хосте
    healthcheck:
      # Проверка готовности БД: ждём пока pg_isready вернёт успешный статус
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s    # Частота проверки
      timeout: 5s     # Таймаут выполнения команды проверки
      retries: 10     # Первый init кластера на пустом volume может занять дольше
      start_period: 30s

  # Backend API для работы с данными судов (читает из БД и отдаёт фронтенду)
  vessel_api:
    build:
      context: .
      dockerfile: vessel_api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Настройки подключения к БД — совпадают с параметрами у db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      AIS_LOG_DIR: /app/logs
    ports:
      - "8000:8000"   # Публикуем API на http://localhost:8000
    volumes:
      - ./data/vessel_images:/app/images:ro  # Каталог с изображениями (только чтение для API)
      - ./logs:/app/logs                     # Файловые логи API на хосте
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # VesselFinder (HTTP + BeautifulSoup). Профиль demo — один скрапер для локального просмотра стека.
  vesselfinder_scraper:
    build:
      context: ./AIS_scrapers
      dockerfile: vesselfinder/Dockerfile
    profiles:
      - demo
    # После успешного завершения процесс выходит с 0 — не перезапускать бесконечно (в test лимит страниц).
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      vessel_api:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      NO_PROXY: ${NO_PROXY}
      SCRAPER_MODE: "full"
      # "Мягкий" режим, чтобы снизить риск блокировки IP:
      SOFT_MAX_WORKERS: "1"
      DETAIL_DELAY_MULTIPLIER: "3.0"
      BREAK_DURATION_MULTIPLIER: "2.0"
      FAILURE_STREAK_LIMIT: "3"
      FAILURE_COOLDOWN_SECONDS: "900"
      AIS_LOG_DIR: /app/logs
      LOG_LEVEL: INFO
    volumes:
      - ./data/vessel_images:/app/images
      - ./logs:/app/logs

  # Скрапер Maritime Database, пишет данные и фото
  maritime_scraper:
    build:
      context: ./AIS_scrapers
      dockerfile: maritime_database/Dockerfile
    profiles:
      - scrapers
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      SCRAPER_MODE: "full"
      AIS_LOG_DIR: /app/logs
      LOG_LEVEL: INFO
    volumes:
      - type: bind
        source: ./data/vessel_images
        target: /app/images
        bind:
          create_host_path: true
      - ./logs:/app/logs

  # Скрапер MyShipTracking, пишет данные о судах
  myshiptracking_scraper:
    build:
      context: ./AIS_scrapers
      dockerfile: myshiptracking/Dockerfile
    profiles:
      - scrapers
    depends_on:
      db:
        condition: service_healthy  # Запускать только когда БД перешла в состояние Healthy
    env_file: .env
    environment:
      # Подключение к БД
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      # Режим работы скрапера: test|full
      SCRAPER_MODE: "full"
      AIS_LOG_DIR: /app/logs
    volumes:
      - type: bind
        source: ./data/vessel_images   # Папка изображений на хосте
        target: /app/images            # Точка монтирования внутри контейнера
        bind:
          create_host_path: true       # Создать папку на хосте, если её нет
      - ./logs:/app/logs               # Логи скрапера на хосте

  # Скрапер MarineTraffic, пишет данные о судах (приоритет 1)
  marinetraffic_scraper:
    build:
      context: ./AIS_scrapers
      dockerfile: marinetraffic/Dockerfile
    profiles:
      - scrapers
    depends_on:
      db:
        condition: service_healthy  # Запускать только когда БД перешла в состояние Healthy
    env_file: .env
    environment:
      # Подключение к БД
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      # Режим работы скрапера: test|full
      SCRAPER_MODE: "full"
      AIS_LOG_DIR: /app/logs
    volumes:
      - type: bind
        source: ./data/vessel_images   # Папка изображений на хосте
        target: /app/images            # Точка монтирования внутри контейнера
        bind:
          create_host_path: true       # Создать папку на хосте, если её нет
      - ./logs:/app/logs               # Логи скрапера на хосте

  # Фронтенд (Nginx + статический сайт), обращается к API
  vessel_frontend:
    build: ./vessel_frontend
    depends_on:
      vessel_api:
        condition: service_healthy
    env_file: .env
    ports:
      - "3000:80"        # Публикуем фронтенд на http://localhost:3000
    environment:
      # Базовый URL API для фронтенда (используется Vite/Tailwind сборкой)
      VITE_API_URL: ${VITE_API_URL}

