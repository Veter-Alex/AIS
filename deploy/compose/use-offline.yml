services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  vessel_api:
    build:
      context: ../..
      dockerfile: vessel_api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      AIS_LOG_DIR: /app/logs
      DB_POOL_MIN_CONN: "1"
      DB_POOL_MAX_CONN: "5"
    ports:
      - "8000:8000"
    volumes:
      - ../../data/vessel_images:/app/images:ro
      - ../../logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  vessel_frontend:
    build: ../../vessel_frontend
    restart: unless-stopped
    depends_on:
      vessel_api:
        condition: service_healthy
    env_file: ../../.env
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "3000:80"
