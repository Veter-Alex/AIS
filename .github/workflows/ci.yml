name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vessel_api/requirements.txt
          pip install -r ai_agent/requirements.txt
          pip install -r AIS_scrapers/marinetraffic/requirements.txt
          pip install -r AIS_scrapers/myshiptracking/requirements.txt
          pip install -r AIS_scrapers/maritime_database/requirements.txt
          pip install -r AIS_scrapers/vesselfinder/requirements.txt
          pip install pytest

      - name: Run scraper parser tests
        run: pytest AIS_scrapers/tests/test_parser_smoke.py -q

      - name: Run vessel_api tests
        working-directory: vessel_api
        run: pytest tests -q

      - name: Run ai_agent tests
        working-directory: ai_agent
        run: pytest tests -q

  docker-smoke-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build vessel_api image
        run: docker build -t ais-vessel_api-ci ./vessel_api

      - name: Build ai_agent image
        run: docker build -t ais-ai_agent-ci ./ai_agent
