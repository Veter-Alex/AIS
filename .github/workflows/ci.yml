name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check .
          ruff format --check .

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vessel_frontend/package-lock.json
      - name: Build vessel_frontend
        working-directory: vessel_frontend
        run: |
          npm ci
          npm run build

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vessel_api/requirements.txt
          pip install -r AIS_scrapers/marinetraffic/requirements.txt
          pip install -r AIS_scrapers/myshiptracking/requirements.txt
          pip install -r AIS_scrapers/maritime_database/requirements.txt
          pip install -r AIS_scrapers/vesselfinder/requirements.txt
          pip install pytest

      - name: Run scraper parser tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest AIS_scrapers/tests/test_parser_smoke.py -q

      - name: Run vessel_api tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        working-directory: vessel_api
        run: pytest tests -q

  vessel-api-db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vessels_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d vessels_db"
          --health-start-period 15s
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vessel_api/requirements.txt
          pip install pytest
      - name: Apply Alembic migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vessels_db
        run: alembic upgrade head
      - name: Run vessel_api DB integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/vessel_api
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vessels_db
          RUN_DB_INTEGRATION_TESTS: "1"
        working-directory: vessel_api
        run: pytest tests/test_db_integration.py -q
      - name: Run vessel_api notes sync integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/vessel_api
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vessels_db
          RUN_SYNC_INTEGRATION_TESTS: "1"
        working-directory: vessel_api
        run: pytest tests/test_notes_sync_integration.py -q

  compose-profile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ingestion profile
        run: docker compose -f deploy/compose/ingestion.yml config
      - name: Validate offline profile
        run: docker compose -f deploy/compose/use-offline.yml config

  docker-smoke-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vessel_api image
        run: docker build -f vessel_api/Dockerfile -t ais-vessel_api-ci .

      - name: Build marinetraffic scraper image
        run: |
          docker build -f AIS_scrapers/marinetraffic/Dockerfile \
            -t ais-marinetraffic-ci ./AIS_scrapers

      - name: Build myshiptracking scraper image
        run: |
          docker build -f AIS_scrapers/myshiptracking/Dockerfile \
            -t ais-myshiptracking-ci ./AIS_scrapers
      - name: Build maritime_database scraper image
        run: |
          docker build -f AIS_scrapers/maritime_database/Dockerfile \
            -t ais-maritime-database-ci ./AIS_scrapers
